function isDark(){return S.theme?S.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function applyChrome(){
  const r=document.documentElement;
  r.lang=S.lang; r.dir=S.lang==="he"?"rtl":"ltr"; r.dataset.mode=S.mode;
  if(S.theme) r.dataset.theme=S.theme; else r.removeAttribute("data-theme");
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.content=isDark()?"#060A24":"#EEF2F8";
  $("#appName").textContent=T().name; $("#appSub").textContent=T().sub;
  $("#logoL").src=LOGO[S.lang]; $("#logoD").src=LOGO[S.lang+"_d"];
  const lab={study:T().study,sheet:T().sheet,calc:CU[S.lang].calc,exam:T().exam};
  document.querySelectorAll("[data-m]").forEach(b=>{const sp=b.querySelector("span");(sp||b).textContent=lab[b.dataset.m];b.setAttribute("aria-pressed",S.mode===b.dataset.m)});
  $("#langBtn").textContent=S.lang==="he"?"EN":"עב"; $("#langBtn").setAttribute("aria-label",S.lang==="he"?"Switch to English":"החלף לעברית");
  $("#themeBtn").innerHTML=isDark()?ico.sun:ico.moon;
  document.title=T().name;
}
function render(){applyChrome();S.mode==="study"?renderStudy():S.mode==="sheet"?renderSheetView():S.mode==="calc"?renderCalc():renderExam();}

/* =========================== STUDY =========================== */
function renderStudy(){
  const t=T(), c=CH[S.ch], total=CH.length, done=[...S.learned].filter(id=>id!=="cheat").length;
  const num=i=>String(i+1).padStart(2,"0");
  const rail=CH.map((x,i)=>`<li><button data-ch="${i}" class="${i===S.ch?"on":""} ${S.learned.has(x.id)?"done":""}" ${i===S.ch?'aria-current="page"':""}>
     <span class="dot">${S.learned.has(x.id)&&i!==S.ch?"✓":(x.cheat?"Σ":num(i))}</span><span class="lbl">${esc(tx(x.t))}<small>${esc(tx(x.tag))}</small></span></button></li>`).join("");
  const chips=CH.map((x,i)=>`<button data-ch="${i}" class="${i===S.ch?"on":""} ${S.learned.has(x.id)?"done":""}"><i>${S.learned.has(x.id)?"✓":(x.cheat?"Σ":num(i))}</i>${esc(tx(x.t))}</button>`).join("");
  $("#main").innerHTML=`<div class="view study">
   <aside class="rail"><h4>${t.chapters}</h4>
    <div class="prog"><div class="track"><i style="width:${done/total*100}%"></i></div><span class="ltr">${done}/${total}</span> ${t.learned}</div>
    <ol class="ladder">${rail}</ol></aside>
   <section style="min-width:0">
    <nav class="chips" id="chips">${chips}</nav>
    <article id="chBody">${c.cheat?cheatHTML():chapterHTML(c)}</article>
    <div class="ch-foot">
      <button class="btn flip" data-nav="-1" ${S.ch===0?"disabled":""}>${ico.back}${t.prev}</button>
      ${c.cheat?"":`<button class="btn ${S.learned.has(c.id)?"ok":""}" id="markBtn">${S.learned.has(c.id)?ico.check+t.marked:t.mark}</button>
      <button class="btn" id="quizCh">${t.quizThis}</button>`}
      <span class="sp"></span>
      <button class="btn pri flip" data-nav="1" ${S.ch===CH.length-1?"disabled":""}>${t.next}${ico.arrow}</button>
    </div>
   </section></div>`;
  const on=$("#chips .on"); if(on) on.scrollIntoView({block:"nearest",inline:"center"});
  document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>goCh(+b.dataset.ch));
  document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>goCh(S.ch+ +b.dataset.nav));
  const mb=$("#markBtn"); if(mb) mb.onclick=()=>{S.learned.has(c.id)?S.learned.delete(c.id):(S.learned.add(c.id),toast(t.saved));store.set("learned",[...S.learned]);renderStudy()};
  const qb=$("#quizCh"); if(qb) qb.onclick=()=>{S.sel=new Set([c.id]);S.count=999;setMode("exam");startExam()};
  if(c.gauge) initGauge();
}
function goCh(i){if(i<0||i>=CH.length)return;S.ch=i;store.set("ch",i);renderStudy();window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
function chapterHTML(c){
  const t=T(), idx=CH.indexOf(c)+1;
  let h=`<div class="ch-head"><div class="eyebrow"><span>${t.ch} ${idx} · ${esc(tx(c.tag))}</span><span class="depth">▼ ${tx(c.d)}</span></div>
   <h1>${esc(tx(c.t))}</h1><p class="lead">${esc(tx(c.lead))}</p>
   ${c.f?`<div class="formula">${c.f.map(f=>`<code>${esc(f)}</code>`).join("")}</div>`:""}
   ${c.quote?`<p class="quote">“${esc(tx(c.quote))}”</p>`:""}</div>`;
  if(c.pts) h+=`<div class="sec"><h3>${t.keypoints}</h3><ul class="points">${c.pts.map(p=>`<li>${tx(p)}</li>`).join("")}</ul></div>`;
  if(c.gauge) h+=`<div class="sec"><h3>${t.gauge}</h3>${gaugeHTML()}</div>`;
  if(c.nums) h+=`<div class="sec"><h3>${t.nums}</h3><div class="nums">${c.nums.map(n=>`<div><strong>${esc(n[0])}</strong><span>${esc(tx(n[1]))}</span></div>`).join("")}</div></div>`;
  if(c.acc) h+=`<div class="sec"><h3>${t.accidents}</h3><div class="acc">${c.acc.map(a=>`<article><header><span class="tag ${a.sev?"":"t1"}">${a.sev?(S.lang==="he"?"חמור":"Serious"):(S.lang==="he"?"תאונה":"Injury")}</span><h4>${esc(tx(a.t))}</h4></header><ul>${a.i.map(x=>`<li>${tx(x)}</li>`).join("")}</ul></article>`).join("")}</div></div>`;
  if(c.aid) h+=`<div class="sec"><h3>${t.aid}</h3><ol class="aid">${c.aid.map(x=>`<li><span>${esc(tx(x))}</span></li>`).join("")}</ol></div>`;
  return h;
}
function gaugeHTML(){const t=T();return `<div class="gauge"><div class="col"><div class="bal" id="bal"></div><div class="dl" id="gDl">0 m</div></div>
 <div style="min-width:0"><label for="gd"><span>${t.depth}</span><span class="ltr" id="gDv">0 m</span></label>
 <input type="range" id="gd" min="0" max="40" step="1" value="${S.gd??20}">
 <div class="readout"><div><strong id="gA"></strong><span>${t.amb}</span></div><div><strong id="gV"></strong><span>${t.vol}</span></div>
 <div id="gPo"><strong id="gO"></strong><span>${t.po2}</span></div><div><strong id="gN"></strong><span>${t.pn2}</span></div></div>
 <p class="gnote">${t.gnote}</p></div></div>`}
function initGauge(){const r=$("#gd");const up=()=>{const d=+r.value;S.gd=d;const p=1+d/10,v=1/p,o=.21*p;
  $("#gDv").textContent=d+" m";$("#gDl").textContent=d+" m";$("#gA").textContent=p.toFixed(1)+" ATA";$("#gV").textContent=Math.round(v*100)+"%";
  $("#gO").textContent=o.toFixed(2)+" bar";$("#gN").textContent=(.79*p).toFixed(2)+" bar";$("#gPo").classList.toggle("hot",o>1.4);
  $("#bal").style.transform=`translateY(${d*1.6-32}px) scale(${Math.cbrt(v)})`};r.oninput=up;up()}
function cheatHTML(){
  const t=T(), th=a=>`<tr>${a.map(x=>`<th>${x}</th>`).join("")}</tr>`;
  return `<div class="ch-head"><div class="eyebrow"><span>${esc(tx(CH.at(-1).tag))}</span></div><h1>${t.cheat}</h1><p class="lead">${t.cheatSub}</p></div>
  <div class="sec"><h3>${t.lawacc}</h3><div class="tbl"><table>${th([t.law,t.explains])}${LAW.map(r=>`<tr><td>${esc(tx(r[0]))}</td><td>${esc(tx(r[1]))}</td></tr>`).join("")}</table></div></div>
  <div class="sec"><h3>${t.formula}</h3><div class="tbl"><table>${th([t.law,t.formula,S.lang==="he"?"קבוע":"Constant"])}
   ${[["Boyle","בויל","P₁V₁ = P₂V₂","T"],["Charles","שארל","V₁/T₁ = V₂/T₂","P"],["Gay-Lussac","גיי-ליסאק","P₁/T₁ = P₂/T₂","V"],["Combined","משולב","P₁V₁/T₁ = P₂V₂/T₂","n"],["Ideal gas","גז אידיאלי","PV = nRT","R"],["Dalton","דלטון","P_gas = P_total × F_gas","—"],["Henry","הנרי","C = k_H × P_gas","T"],["Archimedes","ארכימדס","F_b = ρ × V × g","—"]]
    .map(r=>`<tr><td>${S.lang==="he"?r[1]:r[0]}</td><td class="mono">${r[2]}</td><td class="mono">${r[3]}</td></tr>`).join("")}</table></div></div>
  <div class="sec"><h3>${t.dcs}</h3><div class="tbl"><table>${th([t.type,t.cat,t.signs])}${DCST.map(r=>`<tr><td>${esc(tx(r[0]))}</td><td>${esc(tx(r[1]))}</td><td>${esc(tx(r[2]))}</td></tr>`).join("")}</table></div></div>
  <div class="sec"><h3>${t.o2tbl}</h3><div class="tbl"><table>${th([t.po2c,t.maxc,t.usec])}${O2T.map(r=>`<tr><td class="mono">${r[0]}</td><td class="mono">${r[1]} min</td><td>${esc(tx(r[2]))}</td></tr>`).join("")}</table></div></div>
  <div class="sec"><h3>${t.neuro}</h3><div class="tbl"><table>${th(["#",t.chk,t.look])}${NEURO.map((r,i)=>`<tr><td class="mono">${i+1}</td><td>${esc(tx(r[0]))}</td><td>${esc(tx(r[1]))}</td></tr>`).join("")}</table></div></div>`;
}

/* =========================== EXAM =========================== */
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function pool(){return Q.filter(x=>S.sel.has(x.c))}
function startExam(list){
  const src=list||shuffle(pool()).slice(0,S.count>=999?undefined:S.count);
  if(!src.length){toast(T().pickOne);return}
  S.exam={qs:src.map(x=>({...x,order:shuffle([0,1,2,3])})),i:0,ans:[]};
  renderExam();
}
function renderExam(){S.exam?(S.exam.i>=S.exam.qs.length?renderResults():renderQuestion()):renderSetup()}
function renderSetup(){
  const t=T(), chs=CH.filter(c=>!c.cheat), n=pool().length;
  $("#main").innerHTML=`<div class="view exam"><div class="panel">
   <h1 class="ex-title">${t.examT}</h1><p class="sub">${t.examS}</p>
   <div class="lbl2"><span>${t.topics}</span><span><button id="selAll">${t.all}</button> · <button id="selNone">${t.none}</button></span></div>
   <div class="pick" id="topics">${chs.map(c=>`<button data-id="${c.id}" aria-pressed="${S.sel.has(c.id)}"><i class="ltr">${Q.filter(x=>x.c===c.id).length}</i>${esc(tx(c.t))}</button>`).join("")}</div>
   <div class="lbl2"><span>${t.count}</span></div>
   <div class="pick" id="counts">${[10,20,30,999].map(v=>`<button data-v="${v}" aria-pressed="${S.count===v}">${v===999?t.allq:v}</button>`).join("")}</div>
   <div class="start-row"><button class="btn pri flip" id="go" ${n?"":"disabled"}>${t.start}${ico.arrow}</button>
    <span class="meta"><span class="ltr">${Math.min(n,S.count)}</span> / <span class="ltr">${n}</span> ${t.avail}</span></div>
   ${S.best!=null?`<p class="best">${t.best}: <span class="ltr">${S.best}%</span></p>`:""}
  </div></div>`;
  document.querySelectorAll("#topics button").forEach(b=>b.onclick=()=>{const id=b.dataset.id;S.sel.has(id)?S.sel.delete(id):S.sel.add(id);renderSetup()});
  document.querySelectorAll("#counts button").forEach(b=>b.onclick=()=>{S.count=+b.dataset.v;renderSetup()});
  $("#selAll").onclick=()=>{chs.forEach(c=>S.sel.add(c.id));renderSetup()};
  $("#selNone").onclick=()=>{S.sel.clear();renderSetup()};
  $("#go").onclick=()=>startExam();
}
function renderQuestion(){
  const t=T(), E=S.exam, x=E.qs[E.i], d=x[S.lang], a=E.ans[E.i], letters=S.lang==="he"?["א","ב","ג","ד"]:["A","B","C","D"];
  const opts=x.order.map((o,k)=>{let cls="";if(a!=null){if(o===0)cls="right";else if(o===a)cls="wrong";else cls="dim"}
    return `<button class="opt ${cls}" data-o="${o}" ${a!=null?"disabled":""}><span class="k">${letters[k]}</span><span>${esc(d[o+1])}</span></button>`}).join("");
  const last=E.i===E.qs.length-1;
  $("#main").innerHTML=`<div class="view exam" ${a==null?"":'style="animation:none"'}><div class="panel">
   <div class="qtop"><span class="n">${E.i+1}/${E.qs.length}</span><div class="track"><i style="width:${(E.i+(a!=null?1:0))/E.qs.length*100}%"></i></div><button class="x" id="quit">${t.quit}</button></div>
   <div class="qtopic">${esc(tx(chOf(x.c).t))}</div>
   <h2 class="qtext">${esc(d[0])}</h2>
   <div class="opts">${opts}</div>
   ${a!=null?`<div class="fb ${a===0?"good":"bad"}"><b>${a===0?t.correct:t.incorrect}</b>${a===0?"":`<span>${t.answerWas}: ${esc(d[1])}. </span>`}${esc(d[5])}</div>
   <div class="qnav"><button class="btn pri flip" id="nx">${last?t.finish:t.nextQ}${ico.arrow}</button></div>`:""}
   <p class="kbd">${t.keys}</p></div></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.o));
  $("#quit").onclick=()=>{E.qs=E.qs.slice(0,E.ans.length);if(!E.ans.length){S.exam=null}renderExam()};
  const nx=$("#nx"); if(nx){nx.onclick=next;nx.focus({preventScroll:true})}
}
function answer(o){const E=S.exam;if(E.ans[E.i]!=null)return;E.ans[E.i]=o;if(navigator.vibrate&&o!==0)try{navigator.vibrate(30)}catch(e){};renderQuestion()}
function next(){S.exam.i++;renderExam();window.scrollTo({top:0})}
function renderResults(){
  const t=T(), E=S.exam, n=E.qs.length, ok=E.ans.filter(a=>a===0).length, pct=n?Math.round(ok/n*100):0;
  if(n>=5&&(S.best==null||pct>S.best)){S.best=pct;store.set("best",pct)}
  const by={};E.qs.forEach((x,i)=>{(by[x.c]??={n:0,ok:0}).n++;if(E.ans[i]===0)by[x.c].ok++});
  const miss=E.qs.map((x,i)=>({x,a:E.ans[i]})).filter(m=>m.a!==0);
  const C=2*Math.PI*56, msg=t.scoreMsg[pct>=90?3:pct>=75?2:pct>=55?1:0];
  $("#main").innerHTML=`<div class="view exam"><div class="panel">
   <h1 class="ex-title">${t.results}</h1>
   <div class="res" style="margin-top:14px"><div class="ring"><svg viewBox="0 0 132 132"><circle class="bgc" cx="66" cy="66" r="56"/><circle class="fg" id="rg" cx="66" cy="66" r="56" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div>${pct}%</div></div>
    <div style="min-width:0;width:100%"><p style="margin:0 0 4px;font-size:18px;font-weight:600">${msg}</p><p class="sub" style="margin:0 0 14px"><span class="ltr">${ok}/${n}</span></p>
    <div class="bars">${Object.entries(by).map(([c,v])=>{const p=v.ok/v.n*100;return `<div><span>${esc(tx(chOf(c).t))}</span><span class="t"><i style="width:${p}%;background:${p>=75?"var(--ok)":p>=50?"var(--warn)":"var(--bad)"}"></i></span><span class="v">${v.ok}/${v.n}</span></div>`}).join("")}</div></div></div>
   <div class="start-row">${miss.length?`<button class="btn pri" id="rw">${t.retryWrong}</button>`:""}<button class="btn" id="ne">${t.newExam}</button><button class="btn" id="bk">${t.back}</button></div>
   <div class="lbl2" style="margin-top:30px"><span>${t.review}</span></div>
   ${miss.length?`<div class="missed">${miss.map(m=>{const d=m.x[S.lang];return `<article><p class="q">${esc(d[0])}</p>
     ${m.a!=null?`<p class="y">✕ ${t.yours}: ${esc(d[m.a+1])}</p>`:""}<p class="a">✓ ${esc(d[1])}</p><p class="e">${esc(d[5])}</p></article>`}).join("")}</div>`:`<p class="sub">${t.perfect}</p>`}
  </div></div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const r=$("#rg");if(r)r.style.strokeDashoffset=C*(1-pct/100)}));
  const rw=$("#rw"); if(rw) rw.onclick=()=>startExam(shuffle(miss.map(m=>m.x)));
  $("#ne").onclick=()=>{S.exam=null;renderSetup()};
  $("#bk").onclick=()=>{S.exam=null;setMode("study")};
}

/* =========================== CHROME EVENTS =========================== */
function setMode(m){S.mode=m;render();window.scrollTo({top:0})}
document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{if(S.mode!==b.dataset.m)setMode(b.dataset.m)});
$("#langBtn").onclick=()=>{S.lang=S.lang==="he"?"en":"he";store.set("lang",S.lang);render()};
$("#themeBtn").onclick=()=>{S.theme=isDark()?"light":"dark";store.set("theme",S.theme);applyChrome()};
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>{if(!S.theme)applyChrome()});
document.addEventListener("keydown",e=>{
  if(S.mode!=="exam"||!S.exam||S.exam.i>=S.exam.qs.length||e.metaKey||e.ctrlKey||e.altKey)return;
  const E=S.exam,x=E.qs[E.i];
  if(E.ans[E.i]==null&&/^[1-4]$/.test(e.key)){answer(x.order[+e.key-1]);e.preventDefault()}
  else if(E.ans[E.i]!=null&&e.key==="Enter"&&document.activeElement?.id!=="nx"){next();e.preventDefault()}
});
if(S.ch>=CH.length)S.ch=0;
render();
</script>

</body>
</html>
