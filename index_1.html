<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Bilingual study, cheat-sheet, calculators and practice exam for AAUS scientific diver training: diving physics, physiology and accidents.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Dive Physics Study</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#EEF2F8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Secular+One&display=swap">
<style>
/* Layout: a dive slate — sticky instrument bar, chapter rail as a depth ladder, one reading column; exam = one card at a time */
:root{
  --bg:#EEF2F8; --surface:#FFFFFF; --sunk:#E2E8F2; --ink:#0A1146; --muted:#4F5B7C; --line:#D3DBEA;
  --sea:#1F5FAE; --sea-soft:#DCE7F6; --logo-l:block; --logo-d:none; --flag:#C8102E; --flag-soft:#F8E3E6;
  --ok:#1C7A4B; --ok-soft:#DDF0E5; --bad:#B42318; --bad-soft:#FBE4E1; --warn:#9A6200;
  --f-display:"Secular One","IBM Plex Sans Hebrew","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px; --ease:cubic-bezier(.22,1,.36,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#060A24; --surface:#0D1338; --sunk:#090E2D; --ink:#E6EBF8; --muted:#94A1C4; --line:#1F2856;
  --sea:#3AAEE6; --sea-soft:#13285A; --logo-l:none; --logo-d:block; --flag:#FF5D6C; --flag-soft:#3A1820;
  --ok:#4CC38A; --ok-soft:#11352A; --bad:#FF7B6B; --bad-soft:#3D1A17; --warn:#E8B34A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060A24; --surface:#0D1338; --sunk:#090E2D; --ink:#E6EBF8; --muted:#94A1C4; --line:#1F2856;
  --sea:#3AAEE6; --sea-soft:#13285A; --logo-l:none; --logo-d:block; --flag:#FF5D6C; --flag-soft:#3A1820;
  --ok:#4CC38A; --ok-soft:#11352A; --bad:#FF7B6B; --bad-soft:#3D1A17; --warn:#E8B34A; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  -webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
[dir="rtl"] body{font-family:"IBM Plex Sans Hebrew","IBM Plex Sans",system-ui,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px;border-radius:8px}
h1,h2,h3{text-wrap:balance;margin:0}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.logo{flex:none;display:flex;align-items:center}
.logo img{height:40px;width:auto;max-width:none}
.logo .lg-l{display:var(--logo-l)}.logo .lg-d{display:var(--logo-d)}
.bname{min-width:0;padding-inline-start:14px;border-inline-start:1px solid var(--line)}
@media (max-width:760px){.logo img{height:30px}.bname{padding-inline-start:10px}}
@media (max-width:480px){.bname{display:none}}
.brand b{font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{position:relative;z-index:1;border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg .thumb{position:absolute;top:3px;bottom:3px;inset-inline-start:3px;width:calc(50% - 3px);background:var(--surface);border-radius:999px;
  box-shadow:0 1px 2px rgb(0 0 0/.08),0 2px 8px rgb(0 0 0/.06);transition:transform .35s var(--ease)}
.seg .thumb{width:calc((100% - 6px) / 3)}
[data-mode="sheet"] .seg .thumb{transform:translateX(100%)}
[dir="rtl"][data-mode="sheet"] .seg .thumb{transform:translateX(-100%)}
[data-mode="exam"] .seg .thumb{transform:translateX(200%)}
[dir="rtl"][data-mode="exam"] .seg .thumb{transform:translateX(-200%)}
.icons{display:flex;gap:6px}
.ib{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:13px;
  transition:transform .15s var(--ease),background .2s}
.ib:active{transform:scale(.92)}
.ib svg{width:18px;height:18px}
@media (max-width:560px){.brand small{display:none}.brand b{font-size:17px}.seg button{padding:6px 12px}}
@media (max-width:420px){.brand b{display:none}}

/* ---------- shells ---------- */
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{animation:rise .45s var(--ease)}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- study ---------- */
.study{display:grid;grid-template-columns:270px minmax(0,1fr);gap:36px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100dvh - 100px);overflow:auto;padding-bottom:8px}
.rail h4{margin:0 0 8px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:13px;color:var(--muted)}
.prog .track{flex:1;height:6px;background:var(--sunk);border-radius:9px;overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--sea);border-radius:9px;transition:width .5s var(--ease)}
.ladder{list-style:none;margin:0;padding:0;position:relative}
.ladder::before{content:"";position:absolute;inset-inline-start:15px;top:14px;bottom:14px;width:2px;background:var(--line)}
.ladder button{position:relative;display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:0;background:none;padding:8px 10px 8px 0;border-radius:10px;font-size:14.5px;line-height:1.3}
[dir="rtl"] .ladder button{padding:8px 0 8px 10px}
.ladder button:hover{background:var(--sunk)}
.ladder .dot{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--bg);border:2px solid var(--line);
  font-family:var(--f-mono);font-size:11.5px;color:var(--muted);transition:all .25s var(--ease);font-variant-numeric:tabular-nums}
.ladder .on .dot{border-color:var(--sea);background:var(--sea);color:var(--bg)}
.ladder .done .dot{border-color:var(--ok);color:var(--ok)}
.ladder .on.done .dot{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.ladder .on{font-weight:600}
.ladder .lbl{min-width:0}
.ladder .lbl small{display:block;color:var(--muted);font-size:12px;font-weight:400}
.chips{display:none}

.ch-head{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--sea);font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.eyebrow .depth{font-family:var(--f-mono);letter-spacing:0;color:var(--muted);font-weight:500}
.ch-head h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4.4vw,46px);line-height:1.08;letter-spacing:-.01em}
.lead{font-size:18px;color:var(--muted);max-width:62ch;margin:0}
.sec{margin-top:30px}
.sec>h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:12px}
.points{margin:0;padding:0;list-style:none;display:grid;gap:10px;max-width:70ch}
.points li{position:relative;padding-inline-start:22px}
.points li::before{content:"";position:absolute;inset-inline-start:2px;top:.62em;width:8px;height:8px;border-radius:2px;background:var(--sea);transform:rotate(45deg)}
.points b{font-weight:600}
.formula{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.formula code{font-family:var(--f-mono);font-size:clamp(15px,2.2vw,19px);background:var(--sea-soft);color:var(--ink);padding:10px 16px;border-radius:10px;direction:ltr;font-weight:500}
.quote{margin:16px 0 0;font-size:15.5px;color:var(--muted);font-style:italic;max-width:66ch}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.nums div{background:var(--surface);padding:14px 16px}
.nums strong{display:block;font-family:var(--f-mono);font-size:21px;font-weight:600;color:var(--sea);direction:ltr;text-align:start;font-variant-numeric:tabular-nums}
[dir="rtl"] .nums strong{text-align:right}
.nums span{font-size:13px;color:var(--muted);line-height:1.35;display:block;margin-top:2px}
.acc{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.acc article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.acc header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--flag-soft);color:var(--flag);white-space:nowrap}
.tag.t1{background:var(--sea-soft);color:var(--sea)}
.acc h4{margin:0;font-size:16px;line-height:1.3}
.acc ul{margin:0;padding-inline-start:18px;display:grid;gap:6px;font-size:14.5px}
.aid{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:8px;max-width:70ch}
.aid li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;background:var(--ok-soft);border-radius:10px;padding:10px 14px}
.aid li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--ok);color:var(--bg);font-weight:700;font-size:13px;display:grid;place-items:center;margin-top:1px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;min-width:520px;font-size:14.5px}
.tbl th,.tbl td{padding:10px 14px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
.tbl td:first-child{font-weight:600;white-space:nowrap}
.tbl .mono{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}

/* depth gauge */
.gauge{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;grid-template-columns:120px minmax(0,1fr);gap:22px;align-items:center}
.col{position:relative;height:220px;border-radius:10px;overflow:hidden;background:linear-gradient(to bottom,color-mix(in srgb,var(--sea) 18%,var(--surface)),color-mix(in srgb,var(--sea) 70%,#02121a))}
.col .bal{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 0 12%,color-mix(in srgb,var(--flag) 70%,#fff) 30%,var(--flag) 75%);
  box-shadow:0 6px 20px rgb(0 0 0/.25);transition:transform .25s var(--ease)}
.col .dl{position:absolute;inset-inline:0;bottom:8px;text-align:center;font-family:var(--f-mono);color:#fff;font-size:13px;text-shadow:0 1px 2px rgb(0 0 0/.5)}
.gauge label{font-weight:600;font-size:14px;display:flex;justify-content:space-between;gap:10px}
.gauge input[type=range]{width:100%;margin:10px 0 16px;accent-color:var(--sea);height:28px}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.readout div{background:var(--sunk);border-radius:10px;padding:10px 12px}
.readout strong{display:block;font-family:var(--f-mono);font-size:20px;direction:ltr;text-align:start;font-variant-numeric:tabular-nums}
[dir="rtl"] .readout strong{text-align:right}
.readout span{font-size:12.5px;color:var(--muted)}
.readout .hot strong{color:var(--flag)}
.gnote{font-size:13px;color:var(--muted);margin:12px 0 0}

.ch-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
.ch-foot .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:11px 18px;border-radius:999px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;
  transition:transform .15s var(--ease),background .2s,border-color .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--sea);border-color:var(--sea);color:var(--bg)}
.btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn[disabled]{opacity:.4;cursor:default}
.btn svg{width:16px;height:16px}
[dir="rtl"] .flip svg{transform:scaleX(-1)}

@media (max-width:900px){
  .study{grid-template-columns:minmax(0,1fr);gap:0}
  .rail{display:none}
  .chips{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;margin:-4px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 18px;
    padding:4px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none;overscroll-behavior-x:contain}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:none;scroll-snap-align:start;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap;display:flex;gap:7px;align-items:center}
  .chips button i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
  .chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .chips button.on i{color:inherit;opacity:.7}
  .chips button.done:not(.on) i{color:var(--ok)}
  .gauge{grid-template-columns:90px minmax(0,1fr);gap:14px}
  .col{height:200px}
}

/* ---------- exam ---------- */
.exam{max-width:760px;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,32px)}
.ex-title{font-family:var(--f-display);font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1.1;margin-bottom:6px}
.sub{color:var(--muted);margin:0 0 22px}
.lbl2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:22px 0 10px;display:flex;justify-content:space-between;gap:10px}
.lbl2 button{border:0;background:none;color:var(--sea);font-size:12px;letter-spacing:.04em;font-weight:600;text-transform:none;padding:0}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-size:14px;display:flex;align-items:center;gap:7px;transition:all .18s var(--ease)}
.pick button i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pick button[aria-pressed="true"]{background:var(--sea-soft);border-color:var(--sea);color:var(--ink)}
.pick button[aria-pressed="true"] i{color:var(--sea)}
.pick button:active{transform:scale(.96)}
.start-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:28px}
.start-row .meta{color:var(--muted);font-size:14px}
.best{margin-top:16px;font-size:14px;color:var(--muted)}

.qtop{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-size:14px;color:var(--muted)}
.qtop .track{flex:1;height:6px;background:var(--sunk);border-radius:9px;overflow:hidden}
.qtop .track i{display:block;height:100%;background:var(--sea);transition:width .4s var(--ease)}
.qtop .n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr}
.qtop .x{border:0;background:none;color:var(--muted);font-size:14px;padding:4px 6px}
.qtopic{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sea);font-weight:600}
.qtext{font-size:clamp(20px,2.8vw,24px);line-height:1.35;font-weight:600;margin:6px 0 20px;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:start;width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:13px 15px;font-size:16px;line-height:1.4;
  transition:border-color .2s,background .2s,transform .15s var(--ease)}
@media (hover:hover){.opt:not([disabled]):hover{border-color:var(--sea)}}
.opt:not([disabled]):active{transform:scale(.985)}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-family:var(--f-mono);font-size:13px;font-weight:600}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--bg);border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.opt.wrong .k{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.opt.dim{opacity:.55}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-2px)}80%{transform:translateX(2px)}}
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;font-size:15px;animation:rise .35s var(--ease)}
.fb.good{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb b{display:block;margin-bottom:2px}
.fb.good b{color:var(--ok)}.fb.bad b{color:var(--bad)}
.qnav{display:flex;justify-content:flex-end;margin-top:18px}
.kbd{font-size:12px;color:var(--muted);margin-top:14px;text-align:center}
@media (hover:none){.kbd{display:none}}

.res{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.ring{width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bgc{stroke:var(--sunk)}
.ring .fg{stroke:var(--sea);stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:30px;font-weight:600;direction:ltr}
.bars{display:grid;gap:10px;margin-top:6px}
.bars div{display:grid;grid-template-columns:minmax(0,1fr) 110px 52px;gap:10px;align-items:center;font-size:14px}
.bars .t{height:8px;background:var(--sunk);border-radius:9px;overflow:hidden}
.bars .t i{display:block;height:100%;border-radius:9px}
.bars .v{font-family:var(--f-mono);font-size:13px;text-align:end;direction:ltr;font-variant-numeric:tabular-nums}
.missed{display:grid;gap:10px}
.missed article{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--bg)}
.missed p{margin:4px 0 0;font-size:14.5px}
.missed .q{font-weight:600;margin:0}
.missed .a{color:var(--ok)}
.missed .y{color:var(--bad)}
.missed .e{color:var(--muted)}
@media (max-width:560px){.res{grid-template-columns:1fr;justify-items:center;text-align:center}.bars div{grid-template-columns:minmax(0,1fr) 70px 46px;text-align:start}}

/* ---------- cheat sheet ---------- */
.seg button{white-space:nowrap}
@media (max-width:420px){.seg button{padding:6px 10px;font-size:13.5px}}
.sh-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 24px;margin-bottom:22px}
.sh-head>div{flex:1 1 320px;min-width:0}
.sh-head h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4.4vw,46px);line-height:1.08}
.find{position:relative;flex:0 1 320px;min-width:0;width:100%}
.find input{width:100%;font:inherit;font-size:16px;padding:11px 40px 11px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none}
[dir="rtl"] .find input{padding:11px 14px 11px 40px}
.find input:focus{outline:2px solid var(--sea);outline-offset:1px}
.find svg{position:absolute;inset-inline-end:14px;top:50%;width:18px;height:18px;margin-top:-9px;color:var(--muted);pointer-events:none}
.jump{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 22px;padding:2px max(16px,env(safe-area-inset-left,0px))}
.jump::-webkit-scrollbar{display:none}
.jump a{flex:none;font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;background:var(--surface)}
.jump a:hover{color:var(--ink);border-color:var(--sea)}
.grid{columns:3 320px;column-gap:16px}
.blk{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 14px;margin-bottom:16px;scroll-margin-top:90px}
.blk h2{font-size:17px;line-height:1.25;display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.blk h2 i{font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--sea);font-weight:600}
.blk .fx{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.blk .fx code{font-family:var(--f-mono);font-size:13.5px;background:var(--sea-soft);padding:4px 9px;border-radius:7px;direction:ltr;unicode-bidi:isolate}
.blk ul{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:14.5px;line-height:1.45}
.blk li{position:relative;padding-inline-start:14px}
.blk li::before{content:"";position:absolute;inset-inline-start:0;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--sea)}
.blk li.r::before{background:var(--flag)}
.blk .nb{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.blk .nb span{font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:7px;padding:3px 8px}
.blk .nb b{font-family:var(--f-mono);color:var(--ink);font-weight:600;direction:ltr;unicode-bidi:isolate}
mark{background:color-mix(in srgb,var(--flag) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.flow span{background:var(--ok-soft);color:var(--ink);border-radius:8px;padding:6px 10px;font-weight:500}
.flow em{font-style:normal;color:var(--muted)}
[dir="rtl"] .flow em{transform:scaleX(-1);display:inline-block}
.wide{column-span:all}
.empty{color:var(--muted);text-align:center;padding:40px 0}

/* ---------- mode thumb for 4 tabs ---------- */
.seg{grid-template-columns:repeat(4,1fr)!important}
.seg .thumb{width:calc((100% - 6px) / 4)!important}
[data-mode="sheet"] .seg .thumb{transform:translateX(100%)!important}
[data-mode="calc"] .seg .thumb{transform:translateX(200%)!important}
[data-mode="exam"] .seg .thumb{transform:translateX(300%)!important}
[dir="rtl"][data-mode="sheet"] .seg .thumb{transform:translateX(-100%)!important}
[dir="rtl"][data-mode="calc"] .seg .thumb{transform:translateX(-200%)!important}
[dir="rtl"][data-mode="exam"] .seg .thumb{transform:translateX(-300%)!important}
.tabs{display:none}
@media (max-width:760px){
  .seg{display:none}
  .brand b{display:block!important}
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;inset:auto 0 0;z-index:25;
    background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
    border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;font-size:11.5px;font-weight:600;color:var(--muted);transition:color .2s}
  .tabs button svg{width:22px;height:22px;transition:transform .25s var(--ease)}
  .tabs button[aria-pressed="true"]{color:var(--sea)}
  .tabs button[aria-pressed="true"] svg{transform:translateY(-1px) scale(1.06)}
  .tabs button:active svg{transform:scale(.9)}
  .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}

/* ---------- calculators ---------- */
.warnbar{display:flex;gap:10px;align-items:flex-start;background:var(--flag-soft);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:20px;max-width:80ch}
.warnbar b{color:var(--flag)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px;align-items:start}
.calc{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px 20px;scroll-margin-top:90px;min-width:0}
.calc>header{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.calc>header .n{flex:none;width:30px;height:30px;border-radius:9px;background:var(--sea-soft);color:var(--sea);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:13px}
.calc h2{font-size:18px;line-height:1.25}
.calc header p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.full{grid-column:1/-1}
.fld>span{font-size:12.5px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.fld>span b{font-family:var(--f-mono);color:var(--ink);direction:ltr;unicode-bidi:isolate;font-weight:600}
.box{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.box:focus-within{border-color:var(--sea);box-shadow:0 0 0 3px color-mix(in srgb,var(--sea) 20%,transparent)}
.box input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;font-family:var(--f-mono);padding:9px 10px;color:var(--ink);direction:ltr;text-align:start;-moz-appearance:textfield}
.box input::-webkit-inner-spin-button,.box input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.box i{font-style:normal;font-size:12.5px;color:var(--muted);padding-inline-end:10px;white-space:nowrap}
.fld input[type=range]{width:100%;accent-color:var(--sea);height:28px;margin:0}
.cps{display:flex;flex-wrap:wrap;gap:6px}
.cps button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 11px;font-size:13.5px;transition:all .15s var(--ease)}
.cps button[aria-pressed="true"]{background:var(--sea-soft);border-color:var(--sea);font-weight:600}
.cps button:active{transform:scale(.95)}
.out{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.big div{background:var(--sunk);border-radius:12px;padding:10px 12px;min-width:0}
.big strong{display:block;font-family:var(--f-mono);font-size:22px;font-weight:600;direction:ltr;text-align:start;font-variant-numeric:tabular-nums;line-height:1.25;overflow-wrap:anywhere}
[dir="rtl"] .big strong{text-align:right}
.big span{font-size:12.5px;color:var(--muted);line-height:1.35;display:block}
.big .hero{background:var(--sea);color:var(--bg)}
.big .hero span{color:inherit;opacity:.85}
.big .bad strong{color:var(--bad)} .big .warn strong{color:var(--warn)} .big .good strong{color:var(--ok)}
.work{margin-top:12px;font-family:var(--f-mono);font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;direction:ltr;text-align:left;overflow-x:auto;white-space:pre;line-height:1.6}
.note{margin:10px 0 0;font-size:13.5px;color:var(--muted)}
.note.bad{color:var(--bad);font-weight:600}
.note.warn{color:var(--warn);font-weight:600}
.mini{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}
.mini th,.mini td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:start}
.mini th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mini td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.mini tr.me td{color:var(--sea);font-weight:600}
.viz{display:flex;align-items:flex-end;justify-content:center;gap:28px;margin-top:12px;height:120px}
.viz div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.viz i{display:block;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 10%,color-mix(in srgb,var(--sea) 55%,#fff) 35%,var(--sea) 80%);transition:width .3s var(--ease),height .3s var(--ease)}

.toast{position:fixed;inset-inline:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));margin:auto;width:max-content;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:40;transition:transform .3s var(--ease),opacity .3s;transform:translateY(20px);opacity:0;pointer-events:none}
.toast.show{transform:none;opacity:1}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

</head>

{id:"phys",d:"0–5 m",tag:L("Physiology","פיזיולוגיה"),t:L("Respiration & circulation","נשימה ומחזור הדם"),
 lead:L("The two body systems that move oxygen in and carbon dioxide out. Everything else in diving builds on them.","שתי המערכות שמכניסות חמצן ומוציאות פחמן דו-חמצני. כל השאר בצלילה נשען עליהן."),
 pts:[
  L("<b>Why it matters:</b> AAUS divers plan their own dives. Knowing the why lets you spot problems early, and narcosis, cold and fatigue all degrade data quality.","<b>למה זה חשוב:</b> צוללן מדעי מתכנן את הצלילות בעצמו. הבנת הסיבות מאפשרת לזהות בעיה מוקדם, ונרקוזיס, קור ועייפות פוגעים גם באיכות הנתונים."),
  L("<b>Pulmonary system:</b> gas exchange between air and blood. ~300 million <b>alveoli</b> form the exchange surface.","<b>מערכת הריאות:</b> חילוף גזים בין האוויר לדם. כ-300 מיליון <b>נאדיות (אלבאולות)</b> יוצרות את משטח החילוף."),
  L("Exchange across the alveolus is <b>passive diffusion</b>, driven only by the partial-pressure gradient (Dalton & Henry).","המעבר דרך הנאדית הוא <b>דיפוזיה סבילה</b> המונעת רק ממפל הלחצים החלקיים (דלטון והנרי)."),
  L("The breathing reflex is triggered mainly by <b>blood CO₂</b>, not O₂. CO₂ production rises with workload. <b>Hypoxic drive</b> is a secondary O₂ trigger, normally masked.","רפלקס הנשימה מופעל בעיקר על ידי <b>רמת ה-CO₂ בדם</b>, לא ה-O₂. ייצור CO₂ עולה עם המאמץ. <b>הדחף ההיפוקסי</b> הוא מנגנון משני מבוסס חמצן, בדרך כלל מוסתר."),
  L("<b>Cardiovascular system:</b> O₂ rides on <b>hemoglobin</b>; CO₂ returns mostly as <b>bicarbonate</b>. Arteries leave the heart, veins return, <b>capillaries</b> exchange with tissue.","<b>מערכת הלב וכלי הדם:</b> O₂ נקשר ל<b>המוגלובין</b>; CO₂ חוזר בעיקר כ<b>ביקרבונט</b>. עורקים יוצאים מהלב, ורידים חוזרים, וב<b>נימים</b> מתבצע החילוף עם הרקמות."),
  L("Two circuits: <b>pulmonary</b> (heart ↔ lungs) and <b>systemic</b> (heart ↔ body). Heart rate responds to workload and to stress.","שני מעגלים: <b>ריאתי</b> (לב ↔ ריאות) ו<b>סיסטמי</b> (לב ↔ הגוף). קצב הלב מגיב למאמץ וללחץ נפשי.")],
 nums:[["10–18",L("breaths/min at rest","נשימות לדקה במנוחה")],["60–80",L("heartbeats/min, adult at rest","פעימות לדקה במנוחה")],["~300M",L("alveoli","נאדיות")],["4",L("heart chambers","חדרי לב")]]},

{id:"water",d:"5 m",tag:L("Physics","פיזיקה"),t:L("Properties of water","תכונות המים"),
 lead:L("Density, light, sound and heat all change the moment you descend.","צפיפות, אור, קול וחום משתנים כולם ברגע שיורדים מתחת למים."),
 pts:[
  L("Water is <b>~800× denser</b> than air. Drag is high, so streamlining saves air and energy.","המים <b>צפופים פי ~800</b> מהאוויר. ההתנגדות גבוהה, ולכן תנוחה זורמת חוסכת אוויר ואנרגיה."),
  L("<b>Refraction</b> at the mask: objects look <b>~33% larger and ~25% closer</b>. Matters when estimating size or laying a transect.","<b>שבירת אור</b> במסכה: עצמים נראים <b>גדולים ב-33% וקרובים ב-25%</b>. חשוב בהערכת גודל ובפריסת טרנסקט."),
  L("<b>Diffraction</b> off suspended particles in turbid water causes visual reversal.","<b>עקיפה</b> מחלקיקים מרחפים במים עכורים גורמת להיפוך ראייתי."),
  L("<b>Color loss:</b> red and orange go first; by ~15–20 m scenes look blue-green. Use white balance or lights for ID work.","<b>אובדן צבע:</b> אדום וכתום נעלמים ראשונים; בעומק ~15–20 מ' הכול כחול-ירוק. לזיהוי מינים – איזון לבן או תאורה."),
  L("<b>Sound</b> travels ~4× faster in water, but its direction is very hard to localize.","<b>קול</b> נע מהר פי ~4 במים, אבל קשה מאוד לזהות את הכיוון שלו."),
  L("Water conducts heat <b>~25× faster</b> than air.","המים מוליכים חום <b>מהר פי ~25</b> מהאוויר.")],
 acc:[
  {t:L("Hypothermia","היפותרמיה"),i:[L("Uncontrollable shivering can start after a 1°C core drop","רעד בלתי נשלט יכול להתחיל כבר בירידה של 1°C בחום הליבה"),L("Impairs judgment and motor skills, intensifies narcosis, and raises DCS risk","פוגעת בשיקול דעת ובמוטוריקה, מגבירה נרקוזיס ומעלה סיכון ל-DCS")]},
  {t:L("Hyperthermia","היפרתרמיה"),i:[L("More heat absorbed/produced than dissipated, e.g. full suit on a hot deck","הגוף קולט/מייצר יותר חום ממה שהוא מפנה, למשל חליפה מלאה על סיפון חם"),L("Signs: heavy sweating, headache, nausea, dizziness, fainting","סימנים: הזעה רבה, כאב ראש, בחילה, סחרחורת, עילפון")]}],
 aid:[L("Stop the dive or activity","עצור את הצלילה או הפעילות"),L("Hypothermic → warm gradually; hyperthermic → cool and rehydrate","היפותרמיה ← חימום הדרגתי; היפרתרמיה ← קירור ושתייה"),L("Escalating symptoms → medical attention","החמרה בסימנים ← טיפול רפואי")],
 nums:[["~800×",L("water density vs air","צפיפות מים לעומת אוויר")],["+33% / −25%",L("apparent size / distance","גודל / מרחק נראים")],["~4×",L("faster sound","מהירות קול")],["~25×",L("faster heat loss","איבוד חום מהיר יותר")],["15–20 m",L("mostly blue-green","בעיקר כחול-ירוק")]]},

{id:"arch",d:"8 m",tag:L("Physics · buoyancy","פיזיקה · ציפה"),t:L("Archimedes' principle","עקרון ארכימדס"),
 lead:L("Buoyancy is the skill you use every second of a working dive, and a common thread in accidents.","ציפה היא מיומנות שמשתמשים בה בכל שנייה בצלילת עבודה, והיא חוט מקשר בתאונות רבות."),
 f:["F_b = ρ_fluid × V_displaced × g","Net = W_object − W_displaced"],
 quote:L("An object immersed in a fluid experiences an upward force equal to the weight of the fluid it displaces.","גוף הטבול בנוזל מקבל כוח עילוי השווה למשקל הנוזל שהוא דוחה."),
 pts:[
  L("You control buoyancy by changing <b>weight</b> (lead) or <b>displaced volume</b> (BCD, lungs, suit compression).","שולטים בציפה על ידי שינוי <b>משקל</b> (משקולות) או <b>נפח נדחה</b> (מאזן, ריאות, דחיסת החליפה)."),
  L("Three states: positive, negative and neutral. <b>Neutral is an exact point</b>; positive and negative come in degrees.","שלושה מצבים: חיובי, שלילי וניטרלי. <b>ניטרלי הוא נקודה מדויקת</b>; חיובי ושלילי באים בדרגות."),
  L("Saltwater is denser, so the same object is <b>more buoyant in saltwater</b>. Neutral in the ocean → slightly negative (sinks) in fresh water.","מי ים צפופים יותר, ולכן אותו גוף <b>צף יותר במי ים</b>. ניטרלי בים ← שלילי מעט (שוקע) במים מתוקים."),
  L("Worked example: a 20 kg crate displacing 25 L of seawater → 20 − (25 × 1.03) = <b>−5.75 kg</b>. <b>Check this one:</b> the water it displaces outweighs the crate, so physically it floats with 5.75 kg of lift. The slide calls the result \"slightly negative, it will sink\". Ask your instructor which reading the exam expects.","דוגמה: ארגז 20 ק״ג שדוחה 25 ל' מי ים ← 20 − (25 × 1.03) = <b>−5.75 ק״ג</b>. <b>שים לב:</b> המים הנדחים שוקלים יותר מהארגז, כך שפיזיקלית הוא צף עם עילוי של 5.75 ק״ג. בשקופית כתוב \"שלילי מעט, ישקע\". כדאי לברר עם המרצה איזו פרשנות מצופה במבחן.")],
 acc:[
  {t:L("Uncontrolled ascent","עלייה בלתי מבוקרת"),i:[L("Overweighting offset with BCD air → air expands on ascent (Boyle) → runaway positive buoyancy","עודף משקולות שמאוזן באוויר במאזן ← האוויר מתפשט בעלייה (בויל) ← ציפה חיובית שיוצאת משליטה"),L("Raises risk of lung over-expansion and DCS","מעלה סיכון לנזק ריאתי מהתפשטות ול-DCS")]},
  {t:L("Overweighting / task loading","עודף משקל / עומס משימות"),i:[L("Heavy sample bags or camera rigs make hovering harder","שקי דגימות או מצלמות כבדות מקשים על ריחוף"),L("More air use; can push you below planned depth","צריכת אוויר גבוהה; עלול לדחוף מתחת לעומק המתוכנן")]},
  {t:L("Entanglement & entrapment","הסתבכות ולכידה"),i:[L("Transect lines, kelp, monofilament can force negative or positive buoyancy","חבלי טרנסקט, אצות וחוטי דיג יכולים לכפות ציפה שלילית או חיובית"),L("A leading contributor to panic and out-of-air emergencies","גורם מרכזי לפאניקה ולמקרי חוסר אוויר")]}],
 nums:[["1.03 kg",L("1 L seawater","ליטר מי ים")],["1.00 kg",L("1 L fresh water","ליטר מים מתוקים")],["64 lb",L("1 ft³ seawater","רגל מעוקבת מי ים")],["62.4 lb",L("1 ft³ fresh water","רגל מעוקבת מים מתוקים")]]},

{id:"press",d:"10 m",tag:L("Physics · foundations","פיזיקה · יסודות"),t:L("Principles of pressure","עקרונות הלחץ"),
 lead:L("Before the gas laws make sense, you need to be fluent in what pressure means underwater.","לפני שחוקי הגזים מובנים, צריך לשלוט במשמעות של לחץ מתחת למים."),
 f:["1 bar = 100 kPa ≈ 1 atm = 14.7 psi","P_abs = 1 + depth(m)/10  [ATA]"],
 pts:[
  L("<b>Pressure</b> is force per unit area.","<b>לחץ</b> הוא כוח ליחידת שטח."),
  L("<b>Ambient (absolute)</b> pressure = atmosphere + water column. Every <b>10 m of seawater adds 1 bar</b>.","<b>לחץ סביבתי (מוחלט)</b> = אטמוספרה + עמוד המים. כל <b>10 מ' מי ים מוסיפים 1 bar</b>."),
  L("<b>Gauge pressure</b> ignores the atmosphere. It is what your SPG and depth gauge show.","<b>לחץ מד</b> מתעלם מהאטמוספרה. זה מה שמראים מד הלחץ (SPG) ומד העומק."),
  L("The pressure–depth relationship is <b>linear</b>.","הקשר בין לחץ לעומק הוא <b>ליניארי</b>."),
  L("Freshwater is less dense: 1 atm per <b>10.3 m / 34 ft</b> (seawater: 10 m / 33 ft).","מים מתוקים פחות צפופים: 1 atm לכל <b>10.3 מ' / 34 רגל</b> (במי ים: 10 מ' / 33 רגל)."),
  L("Computers default to saltwater. An uncorrected freshwater dive reads <b>slightly deeper</b> (more conservative). Check the setting for lakes, rivers and estuaries.","מחשבי צלילה מוגדרים כברירת מחדל למי ים. צלילה במים מתוקים ללא תיקון תיראה <b>מעט עמוקה יותר</b> (שמרנית יותר). בדוק את ההגדרה באגמים, נהרות ושפכים.")],
 nums:[["1 bar / 10 m",L("seawater","מי ים")],["1 atm / 10.3 m",L("fresh water","מים מתוקים")],["4 ATA",L("at 30 m","בעומק 30 מ'")],["14.7 psi",L("= 1 atm","= 1 atm")]]},

{id:"boyle",d:"15 m",tag:L("Physics · pressure–volume","פיזיקה · לחץ–נפח"),t:L("Boyle's law & barotrauma","חוק בויל וברוטראומה"),gauge:true,
 lead:L("The single law behind the largest family of diving accidents.","החוק האחד שמאחורי משפחת תאונות הצלילה הגדולה ביותר."),
 f:["P₁V₁ = P₂V₂   (T constant)"],
 quote:L("At constant temperature, the volume of a fixed mass of gas is inversely proportional to the pressure applied to it.","בטמפרטורה קבועה, נפח של מסת גז קבועה עומד ביחס הפוך ללחץ המופעל עליה."),
 pts:[
  L("Pressure up → volume down, <b>inversely</b>. Half the volume change happens in the <b>shallowest 10 m</b>, so equalizing and ascent control matter most near the surface.","לחץ עולה ← נפח יורד, <b>ביחס הפוך</b>. מחצית שינוי הנפח מתרחשת ב-<b>10 המטרים הרדודים</b>, ולכן השוואת לחצים ושליטה בעלייה הכי חשובות ליד פני המים."),
  L("Ears and sinuses must be equalized on descent (<b>squeeze</b>) and ascent (<b>reverse block</b>). Lungs equalize by breathing: <b>never hold your breath on scuba</b>.","אוזניים וסינוסים חייבים השוואה בירידה (<b>מעיכה/squeeze</b>) ובעלייה (<b>חסימה הפוכה</b>). הריאות משתוות בנשימה: <b>לעולם לא לעצור נשימה עם סקובה</b>."),
  L("Air use: a tank lasting 60 min at the surface lasts <b>~15 min at 30 m</b>. Gas density and breathing effort rise with depth.","צריכת אוויר: מיכל שמחזיק 60 דקות על פני המים מחזיק <b>~15 דקות ב-30 מ'</b>. צפיפות הגז ומאמץ הנשימה עולים עם העומק."),
  L("Gas in BCD, drysuit and neoprene compresses on descent and expands on ascent. Every depth change needs a buoyancy adjustment.","הגז במאזן, בחליפה היבשה ובניאופרן נדחס בירידה ומתפשט בעלייה. כל שינוי עומק דורש תיקון ציפה."),
  L("<b>Fish too:</b> swim bladders follow Boyle's law. Rapid ascent → everted stomach, bulging eyes, ruptured bladder. A <b>descending device</b> recompresses them.","<b>גם דגים:</b> שלפוחית השחייה מצייתת לחוק בויל. עלייה מהירה ← היפוך קיבה, עיניים בולטות, קרע בשלפוחית. <b>מתקן הורדה</b> מחזיר אותם ללחץ.")],
 acc:[
  {t:L("Ear squeeze / reverse block","מעיכת אוזן / חסימה הפוכה"),i:[L("Delayed equalization or congestion → pain, eardrum rupture, vertigo, infection","השוואה מאוחרת או גודש ← כאב, קרע בעור התוף, ורטיגו, זיהום"),L("Round/oval window rupture → hearing loss and vertigo","קרע בחלון העגול/הסגלגל ← פגיעה בשמיעה וורטיגו"),L("Alternobaric vertigo: sudden pressure difference → extreme dizziness, nausea","ורטיגו אלטרנוברי: הפרש לחצים פתאומי ← סחרחורת קשה, בחילה")]},
  {t:L("Sinus, mask, tooth & GI","סינוסים, מסכה, שיניים ומעיים"),i:[L("Sinus: headache, facial pain, blood-tinged mucus","סינוסים: כאב ראש, כאב בפנים, ריר דמי"),L("Mask squeeze: facial bruising, blood-shot eyes","מעיכת מסכה: חבלות בפנים, עיניים אדומות (שטפי דם)"),L("Barodontalgia: air trapped under a filling → tooth pain","ברודונטלגיה: אוויר כלוא מתחת לסתימה ← כאב שיניים"),L("GI: gas expands on ascent → slow down and let it pass","מעיים: גז מתפשט בעלייה ← להאט ולתת לו לצאת")]},
  {t:L("Pulmonary barotrauma","ברוטראומה ריאתית"),i:[L("Breath-hold ascent → alveoli rupture","עלייה בעצירת נשימה ← קרע בנאדיות"),L("Pneumothorax (lung collapse); tension pneumothorax strains the heart","חזה אוויר (קריסת ריאה); חזה אוויר בלחץ מעמיס על הלב"),L("Mediastinal & subcutaneous emphysema: air under sternum / at the neck","אמפיזמה מדיאסטינלית ותת-עורית: אוויר מתחת לעצם החזה / בבסיס הצוואר")]},
  {t:L("Arterial gas embolism (AGE)","תסחיף גז עורקי (AGE)"),sev:1,i:[L("Gas enters the blood through ruptured alveoli and expands on ascent","גז נכנס לדם דרך נאדיות קרועות ומתפשט בעלייה"),L("Brain → sudden stroke-like signs; heart → cardiac arrest","מוח ← סימנים דמויי שבץ פתאומיים; לב ← דום לב"),L("Onset can be immediate, even underwater","הופעה יכולה להיות מיידית, אפילו מתחת למים")]}],
 aid:[L("ABCs: airway, breathing, circulation","ABC: נתיב אוויר, נשימה, מחזור דם"),L("Activate the Emergency Action Plan / EMS","הפעל את תוכנית החירום (EAP) / שירותי חירום"),L("Give 100% oxygen","תן 100% חמצן"),L("Supine or recovery position; treat for shock","שכיבה על הגב או תנוחת התאוששות; טיפול בהלם"),L("CPR if needed; suspend diving and get a medical evaluation","החייאה במידת הצורך; הפסקת צלילות ובדיקה רפואית")],
 nums:[["50%",L("volume at 10 m (2 ATA)","נפח ב-10 מ' (2 ATA)")],["25%",L("volume at 30 m (4 ATA)","נפח ב-30 מ' (4 ATA)")],["60 → 15 min",L("tank duration, surface → 30 m","זמן מיכל, פני המים ← 30 מ'")]]},

{id:"temp",d:"18 m",tag:L("Physics · temperature","פיזיקה · טמפרטורה"),t:L("Charles's, Gay-Lussac's & combined laws","חוקי שארל, גיי-ליסאק והחוק המשולב"),
 lead:L("Temperature joins pressure and volume. You see it most in the scuba cylinder.","הטמפרטורה מצטרפת ללחץ ולנפח. רואים את זה בעיקר במיכל הצלילה."),
 f:["V₁/T₁ = V₂/T₂  (P const)","P₁/T₁ = P₂/T₂  (V const)","P₁V₁/T₁ = P₂V₂/T₂","PV = nRT"],
 pts:[
  L("<b>Charles:</b> at constant pressure, volume ∝ absolute temperature. <b>Gay-Lussac:</b> at constant volume, pressure ∝ absolute temperature.","<b>שארל:</b> בלחץ קבוע, הנפח ∝ לטמפרטורה המוחלטת. <b>גיי-ליסאק:</b> בנפח קבוע, הלחץ ∝ לטמפרטורה המוחלטת."),
  L("Volume changes need a flexible container; pressure changes happen in rigid ones too, like your cylinder.","שינוי נפח דורש מיכל גמיש; שינוי לחץ קורה גם במיכל קשיח, כמו מיכל הצלילה."),
  L("Heating a cylinder raises pressure; filling it heats it; draining it cools it.","חימום מיכל מעלה לחץ; מילוי מחמם אותו; ריקון מקרר אותו."),
  L("Use <b>Kelvin or Rankine</b>. °C or °F give the wrong answer.","יש להשתמש ב<b>קלווין או רנקין</b>. °C או °F ייתנו תשובה שגויה."),
  L("<b>Combined law</b> holds moles (n) constant. <b>Ideal gas law</b> adds n and R; real gases deviate at high pressure but it's a good approximation.","<b>החוק המשולב</b> מניח מספר מולים (n) קבוע. <b>חוק הגז האידיאלי</b> מוסיף את n ו-R; גזים אמיתיים סוטים בלחץ גבוה אך זה קירוב טוב.")],
 acc:[
  {t:L("Cylinder over-pressurization","לחץ יתר במיכל"),i:[L("Full tank in sun or a hot car → pressure above rated working pressure","מיכל מלא בשמש או ברכב חם ← לחץ מעל לחץ העבודה המדורג"),L("Burst-disc rupture or, rarely, cylinder failure","קרע בדיסק הביטחון או, לעיתים נדירות, כשל המיכל")]},
  {t:L("Cold regulator free-flow","זרימה חופשית בווסת קר"),i:[L("Very cold first stage can ice and free-flow","שלב ראשון קר מאוד עלול לקפוא ולזרום חופשי"),L("Panic response → rapid ascent, buddy separation","תגובת פאניקה ← עלייה מהירה, היפרדות מבן הזוג")]},
  {t:L("Gas-planning error","טעות בתכנון גז"),i:[L("Warm fill, cold depth → less usable gas than the SPG showed topside","מילוי חם ועומק קר ← פחות גז זמין ממה שהמד הראה למעלה")]}],
 nums:[["K = °C + 273",L("absolute temperature","טמפרטורה מוחלטת")],["n",L("constant in combined law","קבוע בחוק המשולב")]]},

{id:"dalton",d:"25 m",tag:L("Physics · partial pressure","פיזיקה · לחץ חלקי"),t:L("Dalton's law & gas toxicity","חוק דלטון ורעילות גזים"),gauge:true,
 lead:L("Partial pressure explains nitrox, narcosis and every kind of gas toxicity.","הלחץ החלקי מסביר את הניטרוקס, הנרקוזיס וכל סוגי הרעילות של גזים."),
 f:["P_total = P₁ + P₂ + …","P_gas = P_total × F_gas"],
 quote:L("Total pressure of a mixture equals the sum of the pressures each gas would exert alone in the same volume.","הלחץ הכולל של תערובת שווה לסכום הלחצים שכל גז היה מפעיל לבדו באותו נפח."),
 pts:[
  L("Each gas keeps its <b>fraction</b> with depth, but its <b>partial pressure rises</b> with ambient pressure.","כל גז שומר על <b>השבר (אחוז)</b> שלו בעומק, אך <b>הלחץ החלקי שלו עולה</b> עם הלחץ הסביבתי."),
  L("Air at 40 m (5 ATA): <b>PO₂ ≈ 1.05 bar</b> (like 100% O₂ at the surface), <b>PN₂ ≈ 3.95 bar</b>.","אוויר ב-40 מ' (5 ATA): <b>PO₂ ≈ 1.05 bar</b> (כמו 100% חמצן על פני המים), <b>PN₂ ≈ 3.95 bar</b>."),
  L("Change the fraction (nitrox, trimix) and you change the gas's effect at a given depth.","שינוי השבר (ניטרוקס, טרימיקס) משנה את השפעת הגז בעומק נתון.")],
 acc:[
  {t:L("Nitrogen narcosis","נרקוזיס חנקני"),i:[L("Little effect above ~20 m, often noticeable near 30 m, worse with depth","השפעה קטנה מעל ~20 מ', מורגש לרוב סביב 30 מ', מחמיר עם העומק"),L("Euphoria or paranoia, poor coordination, impaired reasoning","אופוריה או פרנויה, קואורדינציה ירודה, פגיעה בחשיבה"),L("Worse with cold, dark, murky water, stress, task load","מחמיר בקור, חושך, מים עכורים, לחץ ועומס משימות"),L("Helium less narcotic; argon more (drysuit gas only); O₂ somewhat narcotic","הליום פחות נרקוטי; ארגון יותר (רק לניפוח חליפה יבשה); חמצן מעט נרקוטי"),L("<b>Fix:</b> ascend with your buddy. Effects resolve fully.","<b>טיפול:</b> לעלות עם בן הזוג לעומק רדוד. ההשפעות חולפות לגמרי.")]},
  {t:L("CNS oxygen toxicity","רעילות חמצן למערכת העצבים"),sev:1,i:[L("High PO₂ → convulsions, regulator loss, drowning risk","PO₂ גבוה ← פרכוסים, אובדן ווסת, סכנת טביעה"),L("<b>ConVENTID:</b> Convulsions, Visual, Ears ringing, Nausea, Twitching, Irritability, Dizziness","<b>ConVENTID:</b> פרכוסים, הפרעות ראייה, צלצולים באוזניים, בחילה, עוויתות, עצבנות, סחרחורת"),L("Hold (don't force) the regulator; ascend once convulsions stop","להחזיק (לא לדחוף בכוח) את הווסת; לעלות כשהפרכוסים נפסקים")]},
  {t:L("Pulmonary O₂ toxicity","רעילות חמצן ריאתית"),i:[L("Long exposure to elevated PO₂ dries surfactant","חשיפה ארוכה ל-PO₂ גבוה מייבשת את הסורפקטנט"),L("Chest discomfort, dry cough; mainly chamber and saturation diving","אי-נוחות בחזה, שיעול יבש; בעיקר בתא לחץ ובצלילת רוויה")]},
  {t:L("CO₂ toxicity (hypercapnia)","רעילות CO₂ (היפרקפניה)"),i:[L("From workload, cold, poor fitness, bad regulator","ממאמץ, קור, כושר ירוד, ווסת לא תקין"),L("Fast heart rate, headache, confusion, breathlessness","דופק מהיר, כאב ראש, בלבול, קוצר נשימה"),L("Stop work, ABCs, oxygen","להפסיק מאמץ, ABC, חמצן")]},
  {t:L("CO toxicity","הרעלת פחמן חד-חמצני"),sev:1,i:[L("A contaminant from exhaust or a poorly kept compressor","מזהם מגזי פליטה או ממדחס לא מתוחזק"),L("Binds hemoglobin far more readily than O₂","נקשר להמוגלובין הרבה יותר בקלות מחמצן"),L("Never breathe gas that smells or tastes; ABCs, O₂, sometimes hyperbaric","לעולם לא לנשום גז עם ריח או טעם; ABC, חמצן, לפעמים תא לחץ")]}],
 nums:[["1.05 bar",L("PO₂ on air at 40 m","PO₂ באוויר ב-40 מ'")],["~30 m",L("narcosis noticeable","נרקוזיס מורגש")],["1.4 bar",L("working max PO₂ (150 min)","PO₂ מרבי לעבודה (150 דק')")],["1.6 bar",L("absolute ceiling (45 min)","תקרה מוחלטת (45 דק')")]]},

{id:"henry",d:"30 m",tag:L("Physics · solubility","פיזיקה · מסיסות"),t:L("Henry's law & decompression illness","חוק הנרי ומחלת הדקומפרסיה"),
 lead:L("Why nitrogen moves into and out of your tissues, and the direct cause of DCS.","למה חנקן נכנס לרקמות ויוצא מהן, והגורם הישיר ל-DCS."),
 f:["C_dissolved = k_H × P_gas"],
 quote:L("At constant temperature, the amount of gas dissolved in a liquid is proportional to that gas's partial pressure.","בטמפרטורה קבועה, כמות הגז המומס בנוזל יחסית ללחץ החלקי של אותו גז."),
 pts:[
  L("You <b>on-gas</b> nitrogen at depth and <b>off-gas</b> during and after ascent. It isn't instant.","<b>סופגים</b> חנקן בעומק ו<b>משחררים</b> אותו בעלייה ואחריה. התהליך אינו מיידי."),
  L("On ascent, tissues become <b>super-saturated</b>. Exceed their tolerance and gas forms <b>bubbles</b>: that is DCS.","בעלייה הרקמות הופכות <b>על-רוויות</b>. חריגה מהסבולת ← הגז יוצר <b>בועות</b>: זו DCS."),
  L("Nitrogen is <b>~5× more soluble in fat</b> than in blood or water.","חנקן <b>מסיס פי ~5 בשומן</b> מאשר בדם או במים."),
  L("<b>Onset:</b> usually 15 min – 2 h after surfacing, sometimes 24 h+. Symptoms usually worsen and rarely resolve alone.","<b>הופעה:</b> בדרך כלל 15 דק' – שעתיים אחרי היציאה, לפעמים 24 שעות ויותר. התסמינים לרוב מחמירים ולעיתים נדירות חולפים לבד."),
  L("<b>Risk factors:</b> deep/long dives, skipped stops, fast ascent, repetitive and multi-day diving, flying soon after; dehydration, fat, fitness, age, fatigue, prior DCS, PFO; cold water, heavy exertion, alcohol.","<b>גורמי סיכון:</b> צלילות עמוקות/ארוכות, דילוג על עצירות, עלייה מהירה, צלילות חוזרות ורב-יומיות, טיסה מוקדמת; התייבשות, שומן, כושר, גיל, עייפות, DCS בעבר, PFO; מים קרים, מאמץ, אלכוהול."),
  L("<b>PFO</b>: open in 10–20% of people; lets venous bubbles bypass the lungs. Worth a medical conversation, not automatically disqualifying.","<b>PFO</b>: פתוח אצל 10–20% מהאנשים; מאפשר לבועות ורידיות לעקוף את הריאות. שווה שיחה עם רופא, לא פוסל אוטומטית.")],
 acc:[
  {t:L("Type I DCS (mild)","DCS סוג I (קל)"),i:[L("Musculoskeletal \"bends\": deep joint/limb pain","\"בנדס\" שרירי-שלדי: כאב עמוק במפרקים/גפיים"),L("Skin bends: itching, marbled rash (cutis marmorata), may precede Type II","\"בנדס\" עורי: גרד, פריחה משוישת (cutis marmorata), עלול לבשר על סוג II"),L("Lymphatic: swelling near lymph nodes","לימפטי: נפיחות ליד בלוטות לימפה")]},
  {t:L("Type II DCS (serious)","DCS סוג II (חמור)"),sev:1,i:[L("Neurological: numbness, tingling, weakness, paralysis","נוירולוגי: נימול, עקצוץ, חולשה, שיתוק"),L("Vestibular \"staggers\": vertigo, tinnitus, hearing loss","וסטיבולרי \"staggers\": ורטיגו, טנטון, אובדן שמיעה"),L("Cardiopulmonary \"chokes\": dry cough, chest pain, breathlessness","לב-ריאה \"chokes\": שיעול יבש, כאב בחזה, קוצר נשימה")]},
  {t:L("AGE as part of DCI","AGE כחלק מ-DCI"),sev:1,i:[L("DCI = DCS + AGE","DCI = DCS + AGE"),L("AGE more often from lung over-pressurization than from DCS","AGE נובע לרוב מלחץ יתר בריאות ולא מ-DCS"),L("Inner-ear DCS: same first aid as any DCI","DCS של האוזן הפנימית: אותה עזרה ראשונה כמו בכל DCI")]}],
 aid:[L("ABCs, activate EAP / EMS","ABC, הפעלת תוכנית חירום / שירותי חירום"),L("100% oxygen: speeds off-gassing, shrinks bubbles. Start even before symptoms after a rapid ascent or missed stop","100% חמצן: מאיץ שחרור חנקן ומקטין בועות. להתחיל גם לפני תסמינים אחרי עלייה מהירה או דילוג על עצירה"),L("Lay supine / recovery, treat for shock, CPR if needed","השכבה על הגב / תנוחת התאוששות, טיפול בהלם, החייאה במידת הצורך"),L("5-minute neuro exam, repeat periodically","בדיקה נוירולוגית של 5 דקות, לחזור עליה מדי פעם"),L("Recompression in a hyperbaric chamber is the definitive treatment","טיפול בתא לחץ (רה-קומפרסיה) הוא הטיפול המוגדר")],
 nums:[["15 min–2 h",L("typical DCS onset","הופעת DCS אופיינית")],["24 h+",L("possible delay","עיכוב אפשרי")],["~5×",L("N₂ solubility in fat","מסיסות N₂ בשומן")],["10–20%",L("people with PFO","אנשים עם PFO")]]},

{id:"haldane",d:"33 m",tag:L("Decompression theory","תורת הדקומפרסיה"),t:L("Haldane's model","המודל של הולדיין"),
 lead:L("How tables and computers turn Henry's law into a plannable, repeatable dive.","איך טבלאות ומחשבים הופכים את חוק הנרי לצלילה מתוכננת וחוזרת."),
 pts:[
  L("The body is modeled as theoretical <b>tissue compartments</b>. They don't map to real tissues but approximate the whole process.","הגוף ממודל כ<b>תאי רקמה</b> תאורטיים. הם לא מקבילים לרקמות אמיתיות אבל מקרבים את התהליך כולו."),
  L("<b>Half-time:</b> time for a compartment to go halfway from its current N₂ level toward equilibrium at a new pressure.","<b>זמן מחצית:</b> הזמן שלוקח לתא לעבור חצי מהדרך מרמת החנקן הנוכחית לשיווי משקל בלחץ חדש."),
  L("<b>Fast</b> compartments (blood-rich) equilibrate quickly but tolerate little super-saturation. <b>Slow</b> ones (fat, cartilage) drive repetitive and multi-day planning.","תאים <b>מהירים</b> (עשירים בדם) מתאזנים מהר אך סובלים מעט על-רוויה. תאים <b>איטיים</b> (שומן, סחוס) קובעים את התכנון של צלילות חוזרות ורב-יומיות."),
  L("<b>M-value:</b> the maximum excess nitrogen a compartment can hold during ascent before bubbles form.","<b>ערך M:</b> עודף החנקן המרבי שתא יכול להחזיק בעלייה לפני היווצרות בועות."),
  L("Haldane's tables were used by the Royal Navy from <b>1907 to 1956</b>. Modern refinements: more compartments, recalculated M-values, adjusted ascent rates, different on/off-gassing rates.","הטבלאות של הולדיין שימשו את הצי המלכותי <b>מ-1907 עד 1956</b>. שיפורים מודרניים: יותר תאים, ערכי M מחושבים מחדש, קצבי עלייה מעודכנים וקצבי ספיגה/שחרור שונים."),
  L("Nearly every table and computer today derives from Haldane. Your program's manual sets the required algorithm and conservatism.","כמעט כל טבלה ומחשב צלילה כיום נגזרים מהולדיין. מדריך הבטיחות של התוכנית קובע את האלגוריתם ורמת השמרנות.")],
 nums:[["1907–1956",L("Royal Navy tables","טבלאות הצי המלכותי")],["½",L("per half-time","לכל זמן מחצית")]]},

{id:"other",d:"35 m",tag:L("Physiology · environment","פיזיולוגיה · סביבה"),t:L("Additional concerns","בעיות נוספות"),
 lead:L("Not tied to one gas law, but just as important to recognize and prevent.","לא קשורות לחוק גז אחד, אבל חשוב באותה מידה לזהות ולמנוע."),
 acc:[
  {t:L("Drowning / near-drowning","טביעה / כמעט-טביעה"),sev:1,i:[L("Water in the airway blocks oxygen uptake","מים בנתיב האוויר חוסמים קליטת חמצן"),L("Near-drowning: fluid can build up over hours to days (secondary drowning). Always get medical care","כמעט-טביעה: נוזל יכול להצטבר במשך שעות עד ימים (טביעה משנית). תמיד לפנות לטיפול")]},
  {t:L("Dehydration","התייבשות"),i:[L("A significant DCS risk factor","גורם סיכון משמעותי ל-DCS"),L("Dry tank air, sweating, cold diuresis, caffeine, alcohol","אוויר מיכל יבש, הזעה, השתנה בקור, קפאין, אלכוהול"),L("Urine should be clear to light yellow","השתן צריך להיות שקוף עד צהוב בהיר")]},
  {t:L("Disorientation & seasickness","חוסר התמצאות ומחלת ים"),i:[L("Mid-water with no reference → dizziness, panic. Use a line, instruments, buddy","באמצע המים ללא נקודת ייחוס ← סחרחורת, פאניקה. להשתמש בחבל, במכשירים, בבן הזוג"),L("Seasickness: eye/inner-ear conflict. Ask a dive physician about medication","מחלת ים: סתירה בין העין לאוזן הפנימית. להתייעץ עם רופא צלילה לגבי תרופות")]},

function renderSheet(){
  const t=T(), qv=(S.find||"").trim().toLowerCase();
  const hit=s=>!qv||String(s).toLowerCase().includes(qv);
  const hl=s=>{const e=esc(s);if(!qv)return e;const i=e.toLowerCase().indexOf(esc(qv).toLowerCase());return i<0?e:e.slice(0,i)+"<mark>"+e.slice(i,i+esc(qv).length)+"</mark>"+e.slice(i+esc(qv).length)};
  const blocks=CH.map((c,i)=>{
    const title=tx(c.t), lines=(SHEET[c.id]||[]).map(tx), nums=(c.nums||[]), fx=c.f||[];
    const tHit=hit(title);
    const ls=lines.filter(l=>tHit||hit(l)), ns=nums.filter(n=>tHit||hit(n[0]+" "+tx(n[1]))), fs=fx.filter(f=>tHit||hit(f));
    if(qv&&!tHit&&!ls.length&&!ns.length&&!fs.length) return "";
    return `<section class="blk" id="s-${c.id}"><h2><i class="ltr">${String(i+1).padStart(2,"0")}</i>${hl(title)}</h2>
     ${fs.length?`<div class="fx">${fs.map(f=>`<code>${hl(f)}</code>`).join("")}</div>`:""}
     <ul>${ls.map(l=>{const r=l.startsWith(R);return `<li class="${r?"r":""}">${hl(r?l.slice(1):l)}</li>`}).join("")}</ul>
     ${ns.length?`<div class="nb">${ns.map(n=>`<span><b>${hl(n[0])}</b> ${hl(tx(n[1]))}</span>`).join("")}</div>`:""}</section>`}).join("");
  const th=a=>`<tr>${a.map(x=>`<th>${x}</th>`).join("")}</tr>`;
  const rows=(data,map,mono=[])=>data.filter(r=>!qv||hit(map(r).join(" "))).map(r=>`<tr>${map(r).map((v,k)=>`<td${mono.includes(k)?' class="mono"':""}>${hl(v)}</td>`).join("")}</tr>`).join("");
  const tbl=(h,head,body)=>body?`<div class="sec"><h3>${h}</h3><div class="tbl"><table>${th(head)}${body}</table></div></div>`:"";
  const tables=
    tbl(t.lawacc,[t.law,t.explains],rows(LAW,r=>[tx(r[0]),tx(r[1])]))+
    tbl(t.formula,[t.law,t.formula,S.lang==="he"?"קבוע":"Constant"],rows([["Boyle","בויל","P₁V₁ = P₂V₂","T"],["Charles","שארל","V₁/T₁ = V₂/T₂","P"],["Gay-Lussac","גיי-ליסאק","P₁/T₁ = P₂/T₂","V"],["Combined","משולב","P₁V₁/T₁ = P₂V₂/T₂","n"],["Ideal gas","גז אידיאלי","PV = nRT","R"],["Dalton","דלטון","P_gas = P_total × F_gas","—"],["Henry","הנרי","C = k_H × P_gas","T"],["Archimedes","ארכימדס","F_b = ρ × V × g","—"]],r=>[S.lang==="he"?r[1]:r[0],r[2],r[3]],[1,2]))+
    tbl(t.coll,[t.pres,t.cause,t.resp],rows(COLL,r=>r.map(tx)))+
    tbl(t.dcs,[t.type,t.cat,t.signs],rows(DCST,r=>r.map(tx)))+
    tbl(t.o2tbl,[t.po2c,t.maxc,t.usec],rows(O2T,r=>[r[0],r[1]+" min",tx(r[2])],[0,1]))+
    tbl(t.neuro,["#",t.chk,t.look],rows(NEURO.map((r,i)=>[String(i+1),...r]),r=>[r[0],tx(r[1]),tx(r[2])],[0]));
  const coreHit=!qv||CORE.some(c=>hit(tx(c)));
  const body=blocks+tables;
  return {blocks,tables,coreHit,empty:!blocks&&!tables&&!coreHit};
}
function renderSheetView(){
  const t=T();
  $("#main").innerHTML=`<div class="view">
   <div class="sh-head"><div><div class="eyebrow"><span>AAUS · ${CH.length} ${t.chapters}</span></div><h1>${t.sheetT}</h1><p class="lead" style="margin-top:6px">${t.sheetS}</p></div>
    <label class="find"><input id="find" type="search" placeholder="${t.find}" value="${esc(S.find||"")}" autocomplete="off" aria-label="${t.find}">
     <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></label></div>
   <nav class="jump">${CH.map((c,i)=>`<a href="#s-${c.id}" data-j="${c.id}">${String(i+1).padStart(2,"0")} ${esc(tx(c.t))}</a>`).join("")}</nav>
   <div id="sheetBody"></div></div>`;
  const paint=()=>{const r=renderSheet();
    $("#sheetBody").innerHTML=(r.coreHit?`<div class="sec" style="margin-top:0;margin-bottom:22px"><h3>${t.core}</h3><div class="flow">${CORE.map(c=>`<span>${esc(tx(c))}</span>`).join("<em>→</em>")}</div></div>`:"")+
      (r.blocks?`<div class="grid">${r.blocks}</div>`:"")+r.tables+(r.empty?`<p class="empty">${t.noHit}</p>`:"")};
  paint();
  $("#find").oninput=e=>{S.find=e.target.value;paint()};
  document.querySelectorAll("[data-j]").forEach(a=>a.onclick=e=>{e.preventDefault();const el=document.getElementById("s-"+a.dataset.j);
    if(!el){S.find="";$("#find").value="";paint()}document.getElementById("s-"+a.dataset.j)?.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})});
}

const nf=(n,d=0)=>Number.isFinite(n)?n.toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const ataAt=(d,w="sea")=>1+d/(w==="fresh"?10.3:10);

/* Bühlmann ZH-L16C, N2 */
const ZH={ht:[5,8,12.5,18.5,27,38.3,54.3,77,109,146,187,239,305,390,498,635],
 a:[1.1696,1.0,0.8618,0.7562,0.62,0.5043,0.441,0.4,0.375,0.35,0.3295,0.3065,0.2835,0.261,0.248,0.2327],
 b:[0.5578,0.6514,0.7222,0.7825,0.8126,0.8434,0.8693,0.891,0.9092,0.9222,0.9319,0.9403,0.9477,0.9544,0.9602,0.9653]};
const PS=1.013,WV=0.0627;
const tInit=()=>ZH.ht.map(()=>(PS-WV)*0.79);
const tStep=(T,amb,fn2,t)=>T.map((p,i)=>p+((amb-WV)*fn2-p)*(1-Math.pow(2,-t/ZH.ht[i])));
const tOk=(T,gf)=>T.every((p,i)=>p<=PS+gf*(ZH.a[i]+PS/ZH.b[i]-PS));
function ndlFrom(T,d,fo2,gf,max=240){let x=T;for(let m=0;m<max;m++){const n=tStep(x,PS+d/10,1-fo2,1);if(!tOk(n,gf))return m;x=n}return max}
function afterDive(T,d,fo2,t){return tStep(T,PS+d/10,1-fo2,t)}

function fld(k,label,unit,o={}){return `<label class="fld ${o.full?"full":""}"><span>${label}</span><span class="box"><input id="c-${k}" data-k="${k}" type="number" inputmode="decimal" min="${o.min??0}" max="${o.max??9999}" step="${o.step??1}" value="${C[k]}"><i>${unit}</i></span></label>`}
function rng(k,label,o){return `<label class="fld ${o.full===false?"":"full"}"><span>${label}<b id="lb-${k}"></b></span><input id="c-${k}" data-k="${k}" type="range" min="${o.min}" max="${o.max}" step="${o.step||1}" value="${C[k]}"></label>`}
function cps(k,label,opts,full=true){return `<div class="fld ${full?"full":""}"><span>${label}</span><div class="cps" data-g="${k}">${opts.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${String(C[k])===String(v)}">${l}</button>`).join("")}</div></div>`}
const waterCps=k=>cps(k,CT().water,[["sea",CT().sea],["fresh",CT().fresh]]);
const gfCps=()=>cps("gf",CT().cons,[["1",CT().std+" · GF 100"],["0.9",CT().cn+" · GF 90"],["0.8",CT().vc+" · GF 80"]]);
const card=(n,id,title,sub,inner)=>`<section class="calc" id="calc-${id}"><header><span class="n">${n}</span><div><h2>${title}</h2><p>${sub}</p></div></header><div class="fields">${inner}</div><div class="out" id="o-${id}"></div></section>`;
const fmtLabel={kd:v=>v+" m",xd:v=>v+" m",od:v=>v+" m",hd:v=>v+" m",xf:v=>gasName(v)+" ("+v+"% O₂)",of:v=>gasName(v)+" ("+v+"% O₂)",hf:v=>gasName(v),sd1:v=>v+" m",sd2:v=>v+" m",sd3:v=>v+" m",tt1:v=>v+" °C",tt2:v=>v+" °C",cd:v=>v+" m",vd:v=>v+" m",ld:v=>v+" m",gd:v=>v+" m",d1:v=>v+" m",d2:v=>v+" m",fo2:v=>gasName(v)+(+v>21?" ("+v+"% O₂)":" (21% O₂)"),f1:v=>gasName(v),f2:v=>gasName(v)};

function calcUpdate(src){
  store.set("calc",C);
  document.querySelectorAll("#main [data-k]").forEach(el=>{if(el!==src&&document.activeElement!==el)el.value=C[el.dataset.k];const lb=document.getElementById("lb-"+el.dataset.k);if(lb)lb.textContent=(fmtLabel[el.dataset.k]||String)(C[el.dataset.k])});
  document.querySelectorAll("#main [data-g]").forEach(g=>g.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(C[g.dataset.g])===b.dataset.v)));
  const t=CT(), gf=+C.gf;
  const tile=(v,l,cls="")=>`<div class="${cls}"><strong>${v}</strong><span>${l}</span></div>`;

  /* 1 free air */
  {const V=C.tank,P=C.fill,Rz=Math.min(C.res,P),A=ataAt(C.cd),fa=V*P,us=V*(P-Rz);
   $("#o-c1").innerHTML=`<div class="big">${tile(nf(fa)+" L",t.freeAir,"hero")}${tile(nf(us)+" L",t.usable)}${tile(nf(us/A)+" L",t.atD+" ("+C.cd+" m)")}${tile(nf(fa/28.317,1)+" ft³",t.cuft)}</div>
   <div class="work">Free air  = ${nf(V,1)} L × ${nf(P)} bar = ${nf(fa)} L
Usable    = ${nf(V,1)} L × (${nf(P)} − ${nf(Rz)}) bar = ${nf(us)} L
At ${C.cd} m   = ${nf(us)} L ÷ ${nf(A,1)} ATA = ${nf(us/A)} L</div>`}

  /* 2 volume at depth */
  {const A=ataAt(C.vd,C.vw),V0=C.v0,Vd=V0/A,lost=(V0-Vd)*rho(C.vw),r0=56,rd=r0*Math.sqrt(1/A);
   const rows=[0,10,20,30,40].map(d=>{const a=ataAt(d,C.vw);return `<tr class="${d===C.vd?"me":""}"><td>${d} m</td><td>${nf(a,2)}</td><td>${nf(V0/a,2)} L</td><td>${nf(100/a)}%</td></tr>`}).join("");
   $("#o-c2").innerHTML=`<div class="big">${tile(nf(Vd,2)+" L",t.vd,"hero")}${tile(nf(100/A)+"%",t.pct)}${tile(nf(A,2)+" ATA",t.amb)}${tile("−"+nf(lost,2)+" kg",t.lost)}</div>
   <div class="viz"><div><i style="width:${r0*2}px;height:${r0*2}px"></i>${t.surf} · ${nf(V0,1)} L</div><div><i style="width:${rd*2}px;height:${rd*2}px"></i>${C.vd} m · ${nf(Vd,1)} L</div></div>
   <div class="work">V₂ = V₁ × P₁ / P₂ = ${nf(V0,1)} × 1 / ${nf(A,2)} = ${nf(Vd,2)} L
Lost lift = (${nf(V0,1)} − ${nf(Vd,2)}) L × ${rho(C.vw)} kg/L = ${nf(lost,2)} kg</div>

  {const w=C.lw,r=rho(w),A=ataAt(C.ld,w),neg=C.lm-C.lv*r;

  {const f=C.fo2/100,d=C.gd,A=ataAt(d),po2=f*A,mod14=(1.4/f-1)*10,mod16=(1.6/f-1)*10,ead=(d+10)*(1-f)/0.79-10;
   const ndl=po2>1.6?0:ndlFrom(tInit(),d,f,gf),gas=C.gt*Math.max(C.gp-C.gr,0)/(C.sac*A),mx=Math.min(ndl,gas);

   $("#o-c4").innerHTML=`<div class="big">${tile(po2>1.6?"✕":nd(mx)+" "+t.min,t.maxbt+(po2>1.6?"":" · "+t.limit+" "+(gas<ndl?t.byGas:t.byNdl)),"hero")}${tile(po2>1.6?"✕":nd(ndl)+" "+t.min,t.ndl)}${tile(nf(gas)+" "+t.min,t.gtime)}
     ${tile(nf(po2,2)+" bar",t.po2,po2>1.6?"bad":po2>1.4?"warn":"good")}${tile(nf(mod14,1)+" m",t.mod14)}${tile(nf(mod16,1)+" m",t.mod16)}${f>.21?tile(nf(Math.max(ead,0),1)+" m",t.ead):""}</div>
   ${po2>1.6?`<p class="note bad">${t.over16}</p>`:po2>1.4?`<p class="note warn">${t.over14}</p>`:""}
   <div class="work">PO₂   = ${nf(f,2)} × ${nf(A,1)} ATA = ${nf(po2,2)} bar

   <table class="mini"><tr><th>${t.mix}</th><th>PO₂</th><th>${t.ndl}</th><th>MOD 1.4</th></tr>${mixes}</table>`}

  /* 5 surface interval */
  {const f1=C.f1/100,f2=C.f2/100,n1=ndlFrom(tInit(),C.d1,f1,gf),T1=afterDive(tInit(),C.d1,f1,C.t1);
   const ndlAfter=si=>ndlFrom(tStep(T1,PS,0.79,si),C.d2,f2,gf);
   const hm=m=>`${Math.floor(m/60)}:${String(Math.round(m%60)).padStart(2,"0")}`;
   let html="";
   if(C.t1>n1){html=`<div class="big">${tile(nf(n1)+" "+t.min,t.ndl+" · "+t.d1,"bad")}</div><p class="note bad">${t.d1over}</p>`}
   else{let si=null;if(ndlAfter(0)>=C.t2)si=0;else{for(let m=1;m<=1440;m++){if(ndlAfter(m)>=C.t2){si=m;break}}}

     html=`<div class="big">${tile(si===0?t.none:si==null?t.never:si<60?si+" "+t.min:hm(si)+" h",t.minSI,"hero")}${tile(nf(n1)+" "+t.min,t.ndl+" · "+t.d1+" ("+C.d1+" m)")}${tile(nf(n2fresh)+" "+t.min,t.ndl+" · "+t.d2+" ("+C.d2+" m)")}</div>
     ${C.t2>n2fresh?`<p class="note bad">${t.d2} ${C.t2} ${t.min} > ${n2fresh} ${t.min} (${t.ndl}).</p>`:""}
     <table class="mini"><tr><th>${t.si}</th><th>${t.ndl2} (${C.d2} m, ${gasName(C.f2)})</th></tr>${rows}</table>`}
   html+=`<div class="sec" style="margin-top:16px"><h3>${t.fly}</h3><ul class="points" style="font-size:14.5px"><li>${t.fly1}</li><li>${t.fly2}</li><li>${t.fly3}</li></ul></div>`;
   $("#o-c5").innerHTML=html}

  /* 6 cylinder pressure over profile */
  {let p=C.pp,html="",warnAt=null;const rowsD=[0,10,20,30,40].map(d=>`<tr><td>${d} m</td><td>${nf(ataAt(d),1)}</td><td>${nf(C.ps*ataAt(d),0)} L/min</td><td>${nf(C.ps*ataAt(d)/Math.max(C.pt,.1),1)}</td></tr>`).join("");
   const work=[],segs=[1,2,3].map(i=>{const d=C["sd"+i],m=C["st"+i],A=ataAt(d),rate=C.ps*A/Math.max(C.pt,.1),drop=rate*m,before=p;p=p-drop;
     if(warnAt==null&&p<C.pr-0.5&&m>0)warnAt=i;work.push(`L${i}: ${nf(C.ps)} × ${nf(A,1)} ATA ÷ ${nf(C.pt,1)} L = ${nf(rate,2)} bar/min × ${m} = −${nf(drop)} bar → ${nf(p)} bar`);
     return `<tr class="${p<C.pr-0.5?"me":""}"><td>${i}</td><td>${d} m</td><td>${m} ${t.min}</td><td>${nf(rate,1)}</td><td>${nf(Math.max(p,0))} bar</td></tr>`}).join("");
   const used=(C.pp-p)*C.pt;
   html=`<div class="big">${tile(nf(Math.max(p,0))+" bar",t.left,p<C.pr-0.5?"bad":"hero")}${tile(nf(C.pp-p)+" bar",t.used)}${tile(nf(used)+" L",t.used+" · "+t.freeAir.split(" (")[0])}</div>
   ${warnAt?`<p class="note bad">${t.below} ${warnAt} (${nf(C.pr)} bar).</p>`:""}
   <table class="mini"><tr><th>${t.seg}</th><th>${t.depth}</th><th>${t.dur}</th><th>${t.perMin}</th><th>${t.after}</th></tr>${segs}</table>
   <div class="work">${work.join("\n")}</div>
   <table class="mini"><tr><th>${t.depth}</th><th>ATA</th><th>SAC × ATA</th><th>${t.perMin}</th></tr>${rowsD}</table>`;
   $("#o-c6").innerHTML=html}

  /* 7 pressure vs temperature */
  {const K1=C.tt1+273.15,K2=C.tt2+273.15,pa=(C.tp+1)*K2/K1,pg=pa-1,dp=pg-C.tp;
   const rows=[0,10,20,30,40,50,60].map(c=>{const g=(C.tp+1)*(c+273.15)/K1-1;return `<tr class="${g>C.trp?"me":""}"><td>${c} °C</td><td>${nf(g)} bar</td><td>${g>=C.tp?"+":""}${nf(g-C.tp)}</td></tr>`}).join("");
   $("#o-c7").innerHTML=`<div class="big">${tile(nf(pg)+" bar",t.pnow,pg>C.trp?"bad":"hero")}${tile((dp>=0?"+":"")+nf(dp,1)+" bar",t.change)}${tile(nf(dp/Math.max(Math.abs(C.tt2-C.tt1),1e-9)*(C.tt2===C.tt1?0:1),2)+" bar/°C",t.rate)}</div>
   ${pg>C.trp?`<p class="note bad">${t.overRated}</p>`:""}
   <div class="work">P₂ = P₁ × T₂ / T₁   (absolute)
   = (${nf(C.tp)} + 1) × (${C.tt2} + 273) / (${C.tt1} + 273)
   = ${nf(C.tp+1)} × ${nf(K2,1)} / ${nf(K1,1)} = ${nf(pa,1)} bar abs = ${nf(pg,1)} bar gauge</div>
   <table class="mini"><tr><th>${t.temp}</th><th>${t.pnow}</th><th>${t.change}</th></tr>${rows}</table>`}

  /* 8 distortion */
  {const real=C.dm==="real",S0=C.ds,D0=C.dd;
   const sz=real?S0*4/3:S0*3/4, ds=real?D0*3/4:D0*4/3;
   const rs=real?S0:sz, as=real?sz:S0, rd=real?D0:ds, ad=real?ds:D0, mx=Math.max(rs,as), w=v=>Math.max(14,Math.round(v/mx*96));

   <div class="work">${real?`Seen size = ${nf(S0,1)} × 4/3 = ${nf(sz,1)} cm   (≈ +33%)
Seen dist = ${nf(D0,2)} × 3/4 = ${nf(ds,2)} m    (≈ −25%)`:`Real size = ${nf(S0,1)} × 3/4 = ${nf(sz,1)} cm

  /* 9 SAC */

     ${tile(bm>=100?"100%":"EAN"+Math.floor(bm),t.best+" (PO₂ "+mx+")","hero")}${tile(nf(mod,1)+" m","MOD · PO₂ "+mx)}${tile(nf(ead,1)+" m",t.narc)}</div>

  {const tb=[[0.6,720],[1.0,300],[1.2,210],[1.3,180],[1.4,150],[1.5,120],[1.6,45]];

   $("#o-c14").innerHTML=`<div class="big">${tile(nf(Pt,2)+" bar","PN₂ · "+C.hd+" m","hero")}${tile(nf(P0,2)+" bar","PN₂ · "+t.surf)}</div>

const store={get(k,d){try{const v=localStorage.getItem("dive."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("dive."+k,JSON.stringify(v))}catch(e){}}};

 moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
 arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
 back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
